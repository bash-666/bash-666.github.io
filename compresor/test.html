<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba ffmpeg</title>
<style>body{font-family:sans-serif;background:#0B2E5C;color:#fff;padding:20px} pre{white-space:pre-wrap;word-break:break-all;background:rgba(255,255,255,.1);padding:12px;border-radius:6px}</style>
</head>
<body>
<h1>Prueba de carga de ffmpeg</h1>
<pre id="out">cargando…</pre>
<script type="importmap">
{
  "imports": {
    "@ffmpeg/ffmpeg": "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm",
    "@ffmpeg/util": "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm"
  }
}
</script>
<script type="module">
import { FFmpeg } from "@ffmpeg/ffmpeg";
import { toBlobURL } from "@ffmpeg/util";
const out = document.getElementById("out");
const log = (m) => { out.textContent += "\n" + m; };
log("SharedArrayBuffer en main thread: " + typeof SharedArrayBuffer);
log("crossOriginIsolated: " + (typeof crossOriginIsolated !== "undefined" ? crossOriginIsolated : "n/a"));
try {
  const baseURL = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";
  log("paso 1: import ok");
  const coreURL = await toBlobURL(baseURL + "/ffmpeg-core.js", "text/javascript");
  log("paso 2: toBlobURL core ok -> " + coreURL.slice(0, 40));
  const wasmURL = await toBlobURL(baseURL + "/ffmpeg-core.wasm", "application/wasm");
  log("paso 3: toBlobURL wasm ok -> " + wasmURL.slice(0, 40));
  const ffmpeg = new FFmpeg();
  ffmpeg.on("log", (d) => log("ffmpeg log: " + d.message));
  await ffmpeg.load({
    classWorkerURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js",
    coreURL, wasmURL
  });
  log("paso 4: LOAD OK, loaded=" + ffmpeg.loaded);
  await ffmpeg.writeFile("t.wav", new Uint8Array([1,2,3]));
  log("paso 5: writeFile ok");
  const code = await ffmpeg.exec(["-i", "t.wav", "t.mp3"]);
  log("paso 6: exec code=" + code);
} catch (e) {
  log("ERROR: " + (e && e.name) + ": " + (e && e.message));
  if (e && e.stack) log("STACK: " + e.stack);
}
</script>
</body>
</html>
