  .taskbar .clock .time{ font-size:0.85rem; font-weight:600; color:#fff; }
  .taskbar .clock .date{ font-size:0.62rem; color:var(--ink-dim); text-transform:capitalize; }

  /* menu button: hidden by default, shown on narrow screens as a
     replacement for the inline taskbar links (which no longer get
     display:none — they move into an accessible slide-up sheet instead) */
  .menu-btn{
    display:none;
    width:38px; height:38px;
    flex-shrink:0;
    align-items:center; justify-content:center;
    border-radius:4px;
    border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.08);
    color:#fff;
    cursor:pointer;
  }
  .menu-btn:hover, .menu-btn:focus-visible{ background:rgba(255,255,255,0.2); }
  .menu-btn svg{ display:block; }

  .nav-backdrop{
    position:fixed; inset:0;
    background:rgba(4,15,35,0.55);
    z-index:90;
    opacity:0; pointer-events:none;
    transition:opacity .18s ease;
  }
  .nav-backdrop.open{ opacity:1; pointer-events:auto; }

  .nav-sheet{
    position:fixed; left:0; right:0; bottom:0;
    z-index:91;
    padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 14px);
    border-radius:10px 10px 0 0;
    transform:translateY(100%);
    transition:transform .22s ease;
  }
  .nav-sheet.open{ transform:translateY(0); }
  .nav-sheet .sheet-handle{
    width:36px; height:4px; border-radius:2px;
    background:rgba(255,255,255,0.4);
    margin:2px auto 12px;
  }
  .nav-sheet a{
    display:flex; align-items:center;
    gap:12px;
    font-size:1rem;
    font-weight:600;
    color:#fff;
    text-decoration:none;
    padding:14px 12px;
    border-radius:6px;
    min-height:44px;
  }
  .nav-sheet a:hover, .nav-sheet a:focus-visible{ background:rgba(255,255,255,0.14); }
  .nav-sheet a:not(:last-child){ border-bottom:1px solid rgba(255,255,255,0.12); }
  .nav-sheet a .dot{
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
    background:var(--c, var(--cobalt));
  }

  @media (max-width:420px){
    header{ margin:14px 0 12px; padding:14px 16px; }
    .taskbar .links{ display:none; }
    .menu-btn{ display:flex; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="glass" id="top">
    <div>
      <div class="wordmark">A.P.T <b>vlog</b></div>
      <div class="tagline">bitácora personal</div>
    </div>
  </header>

  <div class="toolbar glass">
    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="#123" stroke-width="1.4"/><line x1="11" y1="11" x2="15" y2="15" stroke="#123" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="Buscar hallazgos, mods, firmware…" autocomplete="off">
    </div>
    <div class="cats-scroll">
      <div class="cats" id="cats">
        <button class="cat-btn active" data-cat="todos" style="--c:var(--steel)">Todos</button>
      </div>
    </div>
  </div>

  <div class="tiles" id="list"></div>

</div>

<div class="detail-screen" id="detail-screen">
  <button class="back-btn" id="back-btn" aria-label="Volver">←</button>
  <button class="share-btn" id="share-btn" aria-label="Compartir esta entrada">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
  </button>
  <div class="detail-inner" id="detail-inner"></div>
</div>

<div class="taskbar">
  <button class="start-orb" id="start-orb" aria-label="Volver arriba"></button>
  <div class="links" id="taskbar-links"></div>
  <button class="menu-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="nav-sheet" aria-label="Abrir menú de enlaces">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4.5H16M2 9H16M2 13.5H16" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <div class="clock">
    <div class="time" id="clock-time">--:--</div>
    <div class="date" id="clock-date">—</div>
  </div>
</div>

<div class="nav-backdrop" id="nav-backdrop"></div>
<nav class="nav-sheet glass" id="nav-sheet" role="menu" aria-label="Enlaces del sitio" aria-hidden="true">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div id="nav-sheet-links"></div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

  let activeCat = "todos";

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function catById(id){
    return CATEGORIES.find(c => c.id === id);
  }

  // Evita tiles ilegibles: si el color de fondo (de una categoría) resulta
  // demasiado claro, el texto pasa de blanco a oscuro automáticamente.
  function readableTextColor(bgColor){
    if(!bgColor || typeof bgColor !== 'string' || bgColor[0] !== '#') return '#ffffff';
    let hex = bgColor.slice(1);
    if(hex.length === 3) hex = hex.split('').map(ch => ch + ch).join('');
    if(hex.length !== 6) return '#ffffff';
    const num = parseInt(hex, 16);
    if(Number.isNaN(num)) return '#ffffff';
    const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const luminance = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    return luminance > 0.6 ? '#16232f' : '#ffffff';
  }

  // Convierte URLs sueltas dentro de un texto ya escapado en <a> clicables.
  function linkify(escapedText){
    const urlPattern = /((https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?)\]'"])/gi;
    return escapedText.replace(urlPattern, (match) => {
      const href = match.startsWith('http') ? match : `https://${match}`;
      return `<a href="${href}" target="_blank" rel="noopener noreferrer">${match}</a>`;
    });
  }

  // Fecha relativa para entradas recientes ("hoy", "ayer", "hace 3 días");
  // más allá de una semana usa la fecha corta normal.
  function relativeDate(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diffDays = Math.round((today - d) / 86400000);
    if(diffDays === 0) return 'hoy';
    if(diffDays === 1) return 'ayer';
    if(diffDays > 1 && diffDays <= 6) return `hace ${diffDays} días`;
    return d.toLocaleDateString('es-MX', { day:'numeric', month:'short' });
  }

  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2800);
  }

  function renderCatButtons(){
    const cats = document.getElementById('cats');
    const todosBtn = document.querySelector('.cat-btn[data-cat="todos"]');
    const visiblePosts = POSTS.filter(p => !p.hidden);
    todosBtn.innerHTML = `Todos <span class="count">(${visiblePosts.length})</span>`;
    CATEGORIES.forEach(c => {
      const count = visiblePosts.filter(p => p.category === c.id).length;
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.dataset.cat = c.id;
      btn.style.setProperty('--c', c.color);
      btn.style.setProperty('--cat-ink', readableTextColor(c.color));
      btn.innerHTML = `${escapeHtml(c.label)} <span class="count">(${count})</span>`;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = c.id;
        renderWithFade();
        btn.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
      });
      cats.appendChild(btn);
    });
    todosBtn.addEventListener('click', function(){
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      activeCat = 'todos';
      renderWithFade();
      this.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    });
  }

  // Envuelve render() con un fundido corto — se usa al cambiar de
  // categoría (no en el buscador, para que escribir se sienta instantáneo).
  function renderWithFade(){
    const list = document.getElementById('list');
    list.classList.add('fade-out');
    clearTimeout(renderWithFade._t);
    renderWithFade._t = setTimeout(() => {
      render();
      list.classList.remove('fade-out');
    }, 140);
  }

  // Tile destacado (el grande, arriba): casi siempre la entrada más
  // reciente, pero de vez en cuando una al azar — como los "live tiles".
  let featuredId = null;
  function pickFeatured(){
    const visible = POSTS.filter(p => !p.hidden);
    if(visible.length === 0){ featuredId = null; return; }
    const sorted = visible.slice().sort((a,b) => new Date(b.date) - new Date(a.date));
    const useRandom = sorted.length > 1 && Math.random() < 0.3;
    featuredId = useRandom ? sorted[Math.floor(Math.random() * sorted.length)].id : sorted[0].id;
  }

  // Carga diferida de las imágenes de fondo de los tiles: solo se
  // aplica background-image cuando el tile entra en pantalla.
  const tileObserver = ('IntersectionObserver' in window)
    ? new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(!entry.isIntersecting) return;
          const el = entry.target;
          el.style.backgroundImage = `url("${el.dataset.thumb}")`;
          tileObserver.unobserve(el);
        });
      }, { rootMargin: '200px 0px' })
    : null;

  function render(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = document.getElementById('list');
    const isDefaultView = (activeCat === "todos" && !q);

    let items = POSTS.filter(p => !p.hidden).sort((a,b) => new Date(b.date) - new Date(a.date));

    if(activeCat !== "todos"){
      items = items.filter(p => p.category === activeCat);
    }
    if(q){
      items = items.filter(p => {
        const haystack = [p.title, p.summary, p.device, ...(p.body || [])].join(' ').toLowerCase();
        return haystack.includes(q);
      });
    }

    list.innerHTML = "";

    if(POSTS.length === 0){
      list.innerHTML = '<div class="state-msg">Aún no hay entradas publicadas.</div>';
      return;
    }
    if(items.length === 0){
      const msg = q
        ? `Sin resultados para "${escapeHtml(document.getElementById('search').value.trim())}".`
        : 'Sin entradas en esta categoría todavía.';
      list.innerHTML = `<div class="state-msg">${msg}</div>`;
      return;
    }

    items.forEach((p, i) => {
      const cat = catById(p.category);
      const color = cat ? cat.color : 'var(--steel)';
      const label = cat ? cat.label : '';
      const thumb = (p.images && p.images[0] && p.images[0].src) ? p.images[0].src : null;

      const d = new Date(p.date + 'T00:00:00');
      const dateStr = relativeDate(p.date);
      const isWide = isDefaultView ? (p.id === featuredId) : (i === 0);

      const tile = document.createElement('div');
      tile.className = 'tile' + (isWide ? ' wide' : '') + (thumb ? ' has-thumb' : '');
      tile.style.setProperty('--c', color);
      tile.style.color = thumb ? '#ffffff' : readableTextColor(color);
      if(thumb){
        tile.dataset.thumb = thumb;
        if(tileObserver) tileObserver.observe(tile);
        else tile.style.backgroundImage = `url("${thumb}")`; // respaldo sin lazy load
      }
      if(p.tileAspect) tile.style.aspectRatio = p.tileAspect;
      tile.innerHTML = `
        ${label ? `<div class="tile-cat">${escapeHtml(label)}</div>` : ''}
        <div class="tile-title">${escapeHtml(p.title)}</div>
        <div class="tile-date">${dateStr}</div>
      `;
      tile.addEventListener('click', () => openDetail(p));
      list.appendChild(tile);
    });
  }

  /* ---------------- pantalla de detalle ---------------- */
  const detailScreen = document.getElementById('detail-screen');
  const detailInner = document.getElementById('detail-inner');

  let currentPost = null;

  // Controla el carrusel: mismas dimensiones de marco sin importar el
  // tamaño real de cada foto, con flechas y contador si hay más de una.
  let activeCarouselNav = null; // { prev(), next() } de la entrada abierta, o null

  function initCarousel(root, imgs){
    activeCarouselNav = null;
    const carousel = root.querySelector('.carousel');
    if(!carousel || !imgs.length) return;
    const frame = carousel.querySelector('.carousel-frame');
    const slides = [...frame.querySelectorAll('img')];
    const prevBtn = frame.querySelector('.prev');
    const nextBtn = frame.querySelector('.next');
    const countEl = frame.querySelector('.carousel-count');
    const captionEl = carousel.querySelector('.carousel-caption');
    if(slides.length < 2) return; // una sola imagen: no hace falta controlador
    let idx = 0;
    function show(n){
      idx = (n + slides.length) % slides.length;
      slides.forEach((img, i) => img.classList.toggle('active', i === idx));
      if(countEl) countEl.textContent = `${idx + 1} / ${slides.length}`;
      if(captionEl) captionEl.textContent = imgs[idx].caption || '';
    }
    prevBtn.addEventListener('click', () => show(idx - 1));
    nextBtn.addEventListener('click', () => show(idx + 1));
    activeCarouselNav = { prev: () => show(idx - 1), next: () => show(idx + 1) };
  }

  // Flechas ← → del teclado: solo actúan mientras hay una entrada abierta
  // con carrusel (2+ imágenes). No interfiere con el buscador ni con nada más.
  document.addEventListener('keydown', (e) => {
    if(!activeCarouselNav) return;
    if(!detailScreen.classList.contains('open')) return;
    if(e.key === 'ArrowLeft'){ activeCarouselNav.prev(); }
    else if(e.key === 'ArrowRight'){ activeCarouselNav.next(); }
  });

  function openDetail(p, pushHash = true){
    currentPost = p;
    const cat = catById(p.category);
    const color = cat ? cat.color : 'var(--steel)';
    const label = cat ? cat.label : '';
    const d = new Date(p.date + 'T00:00:00');
    const dateStr = d.toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' });

    const bodyHtml = (p.body || []).map(par => {
      if(par.trim().startsWith('!')){
        const noteText = par.trim().slice(1).trim();
        return `<div class="note">${linkify(escapeHtml(noteText))}</div>`;
      }
      return `<p>${linkify(escapeHtml(par))}</p>`;
    }).join('');

    const imgs = p.images || [];
    let galleryHtml = '';
    if(imgs.length){
      const slidesHtml = imgs.map((img, i) => {
        const w = img.w || 100, h = img.h || 100;
        return `<img data-idx="${i}" class="${i === 0 ? 'active' : ''}" src="${img.src}" alt="${escapeHtml(img.caption || p.title)}" loading="lazy" style="width:${w}%; height:${h}%;">`;
      }).join('');
      const showControls = imgs.length > 1;
      galleryHtml = `
        <div class="carousel">
          <div class="carousel-frame">
            ${slidesHtml}
            ${showControls ? `
              <button class="carousel-btn prev" aria-label="Imagen anterior">‹</button>
              <button class="carousel-btn next" aria-label="Imagen siguiente">›</button>
              <div class="carousel-count">1 / ${imgs.length}</div>` : ''}
          </div>
          ${imgs[0].caption ? `<div class="carousel-caption">${escapeHtml(imgs[0].caption)}</div>` : ''}
        </div>`;
    }

    detailScreen.style.setProperty('--c', color);
    const dark = readableTextColor(color) === '#16232f';
    detailScreen.style.color = dark ? '#16232f' : '#ffffff';
    detailScreen.style.setProperty('--link-c', dark ? '#0050EF' : '#bfe0ff');
    detailInner.innerHTML = `
      ${label ? `<div class="detail-cat">${escapeHtml(label)}</div>` : ''}
      <h1 class="detail-title">${escapeHtml(p.title)}</h1>
      <div class="detail-meta">${dateStr}${p.device ? `<span class="sep">·</span>${escapeHtml(p.device)}` : ''}</div>
      <div class="detail-summary">${linkify(escapeHtml(p.summary))}</div>
      <div class="detail-body">${bodyHtml}</div>
      ${galleryHtml}
    `;
    initCarousel(detailInner, imgs);
    detailScreen.classList.add('open');
    document.body.style.overflow = 'hidden';
    if(pushHash){
      try{ history.pushState({ post: p.id }, '', `#entrada-${p.id}`); }
      catch(err){ /* entorno restringido (p.ej. preview en iframe): la vista ya se actualizó igual */ }
    }
  }

  function closeDetail(clearHash = true){
    detailScreen.classList.remove('open');
    document.body.style.overflow = '';
    currentPost = null;
    if(clearHash && location.hash){
      try{ history.pushState({}, '', location.pathname + location.search); }
      catch(err){ /* entorno restringido: la vista ya se cerró igual */ }
    }
  }
  document.getElementById('back-btn').addEventListener('click', () => closeDetail());
  document.getElementById('start-orb').addEventListener('click', () => {
    window.scrollTo({ top:0, behavior:'smooth' });
  });

  // Botón de compartir: enlace directo a la entrada abierta.
  // Cadena de respaldos: share nativo -> clipboard moderno -> copia
  // clásica (execCommand) -> mostrar el enlace para copiar a mano.
  function legacyCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(err){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  document.getElementById('share-btn').addEventListener('click', async () => {
    if(!currentPost) return;
    const url = `${location.origin}${location.pathname}#entrada-${currentPost.id}`;

    if(navigator.share){
      try{
        await navigator.share({ title: currentPost.title, text: currentPost.summary || '', url });
        return;
      }catch(err){ return; /* el usuario canceló el share sheet */ }
    }

    if(navigator.clipboard && navigator.clipboard.writeText){
      try{
        await navigator.clipboard.writeText(url);
        toast('Enlace copiado');
        return;
      }catch(err){ /* sigue al siguiente respaldo */ }
    }

    if(legacyCopy(url)){
      toast('Enlace copiado');
      return;
    }

    // Último recurso: mostrar el enlace para copiarlo a mano.
    prompt('No se pudo copiar automáticamente. Copiá este enlace:', url);
  });

  // Si la URL trae #entrada-ID, abre esa entrada directo (enlace compartido).
  function openFromHash(){
    const m = location.hash.match(/^#entrada-(.+)$/);
    if(!m) { closeDetail(false); return; }
    const post = POSTS.find(p => p.id === m[1]);
    if(post) openDetail(post, false);
  }
  window.addEventListener('hashchange', openFromHash);

  /* ---------------- menú de enlaces (accesible, para pantalla vertical) ---------------- */
  const menuBtn = document.getElementById('menu-btn');
  const navSheet = document.getElementById('nav-sheet');
  const navBackdrop = document.getElementById('nav-backdrop');

  document.getElementById('taskbar-links').innerHTML = SITE_LINKS
    .map(l => `<a href="${l.href}">${escapeHtml(l.label)}</a>`).join('');
  document.getElementById('nav-sheet-links').innerHTML = SITE_LINKS
    .map(l => `<a href="${l.href}" role="menuitem"><span class="dot" style="--c:${l.dot || 'var(--cobalt)'}"></span>${escapeHtml(l.label)}</a>`).join('');

  function openMenu(){
    navSheet.classList.add('open');
    navBackdrop.classList.add('open');
    navSheet.setAttribute('aria-hidden', 'false');
    menuBtn.setAttribute('aria-expanded', 'true');
    navSheet.querySelector('a').focus();
  }
  function closeMenu(){
    navSheet.classList.remove('open');
    navBackdrop.classList.remove('open');
    navSheet.setAttribute('aria-hidden', 'true');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', () => {
    navSheet.classList.contains('open') ? closeMenu() : openMenu();
  });
  navBackdrop.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && navSheet.classList.contains('open')) closeMenu();
  });
  navSheet.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

  document.getElementById('search').addEventListener('input', render);

  pickFeatured();
  renderCatButtons();
  render();
  if(location.hash) openFromHash();

  /* ---------------- reloj en vivo, zona horaria del dispositivo ---------------- */
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  function tick(){
    const now = new Date();
    document.getElementById('clock-time').textContent =
      now.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit', timeZone: tz });
    document.getElementById('clock-date').textContent =
      now.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short', timeZone: tz });
  }
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
