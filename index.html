<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.P.T vlog</title>
<style>
  :root{
    --cobalt:#0050EF;
    --teal:#00ABA9;
    --orange:#FA6800;
    --violet:#6A00FF;
    --magenta:#D80073;
    --steel:#647687;
    --green:#60A917;
    --ink:#F2F2F2;
    --ink-dim:#c9d6e3;
    --muted:#7f92a6;
    --glass-line:rgba(255,255,255,0.45);
    --taskbar-h:52px;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  html,body{
    margin:0;
    min-height:100%;
    color:var(--ink);
    font-family:'Segoe UI', 'Segoe UI Historic', Tahoma, Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.25), rgba(255,255,255,0) 45%),
      linear-gradient(180deg, #4E9BD6 0%, #2C6FB0 30%, #164F8E 60%, #0B2E5C 100%);
    background-attachment:fixed;
    padding-bottom:calc(var(--taskbar-h) + 14px);
  }

  ::selection{ background:var(--cobalt); color:#fff; }

  .wrap{ max-width:760px; margin:0 auto; padding:0 16px; }

  /* ---------------- glass utility ---------------- */
  .glass{
    background:linear-gradient(180deg, rgba(255,255,255,0.38), rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.16));
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    border:1px solid var(--glass-line);
    border-radius:6px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.75),
      inset 0 -1px 0 rgba(255,255,255,0.15),
      0 10px 28px rgba(0,15,40,0.35);
  }

  /* ---------------- header ---------------- */
  header{
    margin:22px 0 16px;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .wordmark{
    font-family:'Segoe UI Semilight','Segoe UI Light','Segoe UI',Tahoma,sans-serif;
    font-weight:400;
    font-size:clamp(1.5rem, 5.5vw, 2.1rem);
    letter-spacing:0.01em;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,20,50,0.55);
    display:flex; align-items:center; gap:10px;
  }
  .wordmark b{ font-weight:600; color:#eaffee; }
  .tagline{ font-size:0.72rem; color:var(--ink-dim); font-weight:400; margin-top:2px; }

  /* ---------------- search + cats ---------------- */
  .toolbar{ padding:14px 16px; margin-bottom:14px; }
  .search-row{ position:relative; margin-bottom:12px; }
  .search-row svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    opacity:0.6; pointer-events:none;
  }
  #search{
    width:100%;
    background:rgba(255,255,255,0.85);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:4px;
    color:#123;
    font-family:inherit;
    font-size:0.95rem;
    padding:10px 14px 10px 38px;
    outline:none;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.25);
  }
  #search::placeholder{ color:#5c7080; }
  #search:focus{ box-shadow:inset 0 1px 3px rgba(0,0,0,0.25), 0 0 0 2px rgba(255,255,255,0.6); }

  .cats{ display:flex; flex-wrap:wrap; gap:6px; }
  .cat-btn{
    font-family:inherit;
    font-size:0.75rem;
    font-weight:600;
    padding:7px 14px;
    border-radius:3px;
    border:1px solid rgba(255,255,255,0.4);
    background:linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.04));
    color:#fff;
    cursor:pointer;
    transition:background .12s ease, transform .1s ease;
  }
  .cat-btn:hover{ background:linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.08)); }
  .cat-btn.active{
    background:var(--c, var(--cobalt));
    border-color:transparent;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 6px rgba(0,0,0,0.3);
  }

  /* ---------------- tiles (Windows 8 style) ---------------- */
  .tiles{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:4px;
    margin-bottom:20px;
  }
  @media (orientation:landscape){
    .tiles{ grid-template-columns:repeat(4, 1fr); }
  }
  @media (min-width:900px){
    .tiles{ grid-template-columns:repeat(5, 1fr); }
  }

  .tile{
    position:relative;
    aspect-ratio:1;
    background:var(--c, var(--steel));
    color:#fff;
    cursor:pointer;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:10px;
    transition:transform .1s ease, box-shadow .1s ease;
    box-shadow:0 1px 0 rgba(255,255,255,0.08) inset;
  }
  .tile.wide{
    grid-column:span 2;
    aspect-ratio:2/1;
  }
  .tile:active, .tile.pressed{ transform:scale(0.96); }
  .tile:hover{ box-shadow:0 0 0 2px rgba(255,255,255,0.5) inset; }

  .tile .tile-cat{
    font-size:0.6rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    opacity:0.85;
    margin-bottom:2px;
  }
  .tile .tile-title{
    font-weight:600;
    font-size:0.92rem;
    line-height:1.25;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .tile.wide .tile-title{ font-size:1.15rem; -webkit-line-clamp:2; }
  .tile .tile-date{
    font-size:0.62rem;
    opacity:0.75;
    margin-top:4px;
  }

  .state-msg{
    grid-column:1 / -1;
    color:var(--ink-dim);
    font-style:italic;
    font-size:0.9rem;
    padding:30px 0;
    text-align:center;
  }

  /* ---------------- detail (full-screen Metro app) ---------------- */
  .detail-screen{
    position:fixed; inset:0;
    background:var(--c, var(--steel));
    color:#fff;
    z-index:80;
    overflow-y:auto;
    transform:scale(0.92);
    opacity:0;
    pointer-events:none;
    transition:transform .22s ease, opacity .22s ease;
  }
  .detail-screen.open{
    transform:scale(1);
    opacity:1;
    pointer-events:auto;
  }
  .detail-inner{ max-width:680px; margin:0 auto; padding:60px 24px 60px; }
  .back-btn{
    position:fixed; top:16px; left:16px;
    width:42px; height:42px;
    border-radius:50%;
    background:rgba(0,0,0,0.18);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    font-size:1.2rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    z-index:81;
  }
  .back-btn:hover{ background:rgba(0,0,0,0.3); }
  .detail-cat{
    font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;
    opacity:0.85; margin-bottom:6px;
  }
  .detail-title{
    font-weight:200;
    font-size:clamp(1.8rem, 6vw, 2.6rem);
    line-height:1.1;
    margin:0 0 10px;
  }
  .detail-meta{ font-size:0.8rem; opacity:0.85; margin-bottom:28px; }
  .detail-meta .sep{ margin:0 6px; opacity:0.6; }
  .detail-summary{ font-size:1.05rem; opacity:0.95; margin-bottom:26px; max-width:60ch; }
  .detail-body p{ font-size:0.95rem; line-height:1.7; opacity:0.9; margin:0 0 16px; max-width:62ch; white-space:pre-wrap; }
  .gallery{ display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin:24px 0 4px; padding-bottom:6px; }
  .gallery figure{ margin:0; flex:0 0 auto; background:rgba(0,0,0,0.15); border:1px solid rgba(255,255,255,0.25); }
  .gallery img{ display:block; height:200px; width:auto; max-width:80vw; object-fit:cover; }
  .gallery figcaption{ font-size:0.68rem; opacity:0.8; padding:6px 8px; border-top:1px solid rgba(255,255,255,0.25); }

  /* ---------------- taskbar ---------------- */
  .taskbar{
    position:fixed; left:0; right:0; bottom:0;
    height:var(--taskbar-h);
    display:flex; align-items:center;
    gap:14px;
    padding:0 14px;
    background:linear-gradient(180deg, rgba(30,60,100,0.55), rgba(8,25,50,0.75));
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    backdrop-filter:blur(16px) saturate(160%);
    border-top:1px solid rgba(255,255,255,0.25);
    z-index:70;
  }
  .taskbar .start-orb{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #b6e8ff, #1487d8 55%, #04315e 100%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,0.85), 0 1px 4px rgba(0,0,0,0.5);
    border:none; cursor:pointer;
  }
  .taskbar .links{
    display:flex; gap:14px; flex:1; overflow-x:auto;
    font-size:0.75rem;
  }
  .taskbar .links a{
    color:var(--ink-dim); text-decoration:none; white-space:nowrap;
    padding:4px 2px;
  }
  .taskbar .links a:hover, .taskbar .links a:focus-visible{ color:#fff; }
  .taskbar .clock{ text-align:right; flex-shrink:0; line-height:1.15; }
  .taskbar .clock .time{ font-size:0.85rem; font-weight:600; color:#fff; }
  .taskbar .clock .date{ font-size:0.62rem; color:var(--ink-dim); text-transform:capitalize; }

  /* menu button: hidden by default, shown on narrow screens as a
     replacement for the inline taskbar links (which no longer get
     display:none — they move into an accessible slide-up sheet instead) */
  .menu-btn{
    display:none;
    width:38px; height:38px;
    flex-shrink:0;
    align-items:center; justify-content:center;
    border-radius:4px;
    border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.08);
    color:#fff;
    cursor:pointer;
  }
  .menu-btn:hover, .menu-btn:focus-visible{ background:rgba(255,255,255,0.2); }
  .menu-btn svg{ display:block; }

  .nav-backdrop{
    position:fixed; inset:0;
    background:rgba(4,15,35,0.55);
    z-index:90;
    opacity:0; pointer-events:none;
    transition:opacity .18s ease;
  }
  .nav-backdrop.open{ opacity:1; pointer-events:auto; }

  .nav-sheet{
    position:fixed; left:0; right:0; bottom:0;
    z-index:91;
    padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 14px);
    border-radius:10px 10px 0 0;
    transform:translateY(100%);
    transition:transform .22s ease;
  }
  .nav-sheet.open{ transform:translateY(0); }
  .nav-sheet .sheet-handle{
    width:36px; height:4px; border-radius:2px;
    background:rgba(255,255,255,0.4);
    margin:2px auto 12px;
  }
  .nav-sheet a{
    display:flex; align-items:center;
    gap:12px;
    font-size:1rem;
    font-weight:600;
    color:#fff;
    text-decoration:none;
    padding:14px 12px;
    border-radius:6px;
    min-height:44px;
  }
  .nav-sheet a:hover, .nav-sheet a:focus-visible{ background:rgba(255,255,255,0.14); }
  .nav-sheet a:not(:last-child){ border-bottom:1px solid rgba(255,255,255,0.12); }
  .nav-sheet a .dot{
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
    background:var(--c, var(--cobalt));
  }

  @media (max-width:420px){
    header{ margin:14px 0 12px; padding:14px 16px; }
    .taskbar .links{ display:none; }
    .menu-btn{ display:flex; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="glass" id="top">
    <div>
      <div class="wordmark">A.P.T <b>vlog</b></div>
      <div class="tagline">bitácora personal</div>
    </div>
  </header>

  <div class="toolbar glass">
    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="#123" stroke-width="1.4"/><line x1="11" y1="11" x2="15" y2="15" stroke="#123" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="Buscar hallazgos, mods, firmware…" autocomplete="off">
    </div>
    <div class="cats" id="cats">
      <button class="cat-btn active" data-cat="todos" style="--c:var(--steel)">Todos</button>
    </div>
  </div>

  <div class="tiles" id="list"></div>

</div>

<div class="detail-screen" id="detail-screen">
  <button class="back-btn" id="back-btn" aria-label="Volver">←</button>
  <div class="detail-inner" id="detail-inner"></div>
</div>

<div class="taskbar">
  <button class="start-orb" id="start-orb" aria-label="Volver arriba"></button>
  <div class="links">
    <a href="#sobre-mi">Sobre mí</a>
    <a href="mailto:tu-correo@ejemplo.com">Contacto</a>
    <a href="https://github.com/">GitHub</a>
  </div>
  <button class="menu-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="nav-sheet" aria-label="Abrir menú de enlaces">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4.5H16M2 9H16M2 13.5H16" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <div class="clock">
    <div class="time" id="clock-time">--:--</div>
    <div class="date" id="clock-date">—</div>
  </div>
</div>

<div class="nav-backdrop" id="nav-backdrop"></div>
<nav class="nav-sheet glass" id="nav-sheet" role="menu" aria-label="Enlaces del sitio" aria-hidden="true">
  <div class="sheet-handle" aria-hidden="true"></div>
  <a href="#sobre-mi" role="menuitem"><span class="dot" style="--c:var(--teal)"></span>Sobre mí</a>
  <a href="mailto:tu-correo@ejemplo.com" role="menuitem"><span class="dot" style="--c:var(--orange)"></span>Contacto</a>
  <a href="https://github.com/" role="menuitem"><span class="dot" style="--c:var(--violet)"></span>GitHub</a>
</nav>

<script>
  /* =========================================================
     SITIO PÚBLICO — SOLO LECTURA.
     Este archivo no tiene forma de agregar ni borrar entradas:
     así nadie que visite la página puede tocar tu contenido.

     Para publicar algo nuevo:
     1. Abre editor.html en tu computadora (NO lo subas a GitHub
        Pages, es solo tu herramienta local).
     2. Arma ahí tus categorías y entradas con el formulario.
     3. Copia el bloque de código que te genera.
     4. Pégalo aquí abajo, reemplazando todo entre
        /* === INICIO DATOS === * / y /* === FIN DATOS === * /.
     5. Guarda y sube el cambio con git (add, commit, push).
     Solo tú, con acceso de escritura a tu repo de GitHub, puedes
     hacer ese último paso — esa es la protección real.
     ========================================================= */

  /* === INICIO DATOS === */
  const CATEGORIES = [  {
    "id": "hola",
    "label": "hola",
    "color": "#0050ef"
  },{
    "id": "juegos",
    "label": "JUEGOS",
    "color": "#00ff33"
  },];

  const POSTS = [{
    "id": "634419c2-e084-4649-be52-4a3718c91783",
    "title": "hola amigos",
    "category": "hola",
    "date": "2026-08-08",
    "device": "",
    "summary": "Bienvenida al sitio",
    "body": [
      "ESTA ES LA PRUEBA PARA VER EL FUNCIONAMIENTO DE LA PÁGINA"
    ],
    "images": []
  }, {
    "id": "634419c2-e084-4649-be52-4a3718c91783",
    "title": "ACÁ SE PUBLICARÁN DISTINTOS JUEGOS ------------->",
    "category": "juegos",
    "date": "2026-08-08",
    "device": "",
    "summary": "EN ESTA CATEGORÍA SE PUBLICARAN DISTINTOS JUEGOS DE ANDROID O PC, LAS VERSIONES ORIGINALES O MODS",
    "body": [
      "EN ESTA CATEGORÍA SE PUBLICARAN DISTINTOS JUEGOS DE ANDROID O PC, LAS VERSIONES ORIGINALES O MODS"
    ],
    "images": []
  },];
  /* === FIN DATOS === */

  let activeCat = "todos";

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function catById(id){
    return CATEGORIES.find(c => c.id === id);
  }

  function renderCatButtons(){
    const cats = document.getElementById('cats');
    CATEGORIES.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.dataset.cat = c.id;
      btn.style.setProperty('--c', c.color);
      btn.textContent = c.label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = c.id;
        render();
      });
      cats.appendChild(btn);
    });
    document.querySelector('.cat-btn[data-cat="todos"]').addEventListener('click', function(){
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      activeCat = 'todos';
      render();
    });
  }

  function render(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = document.getElementById('list');

    let items = POSTS.slice().sort((a,b) => new Date(b.date) - new Date(a.date));

    if(activeCat !== "todos"){
      items = items.filter(p => p.category === activeCat);
    }
    if(q){
      items = items.filter(p => {
        const haystack = [p.title, p.summary, p.device, ...(p.body || [])].join(' ').toLowerCase();
        return haystack.includes(q);
      });
    }

    list.innerHTML = "";

    if(POSTS.length === 0){
      list.innerHTML = '<div class="state-msg">Aún no hay entradas publicadas.</div>';
      return;
    }
    if(items.length === 0){
      list.innerHTML = '<div class="state-msg">No se encontraron resultados.</div>';
      return;
    }

    items.forEach((p, i) => {
      const cat = catById(p.category);
      const color = cat ? cat.color : 'var(--steel)';
      const label = cat ? cat.label : p.category;

      const d = new Date(p.date + 'T00:00:00');
      const dateStr = d.toLocaleDateString('es-MX', { day:'numeric', month:'short' });

      const tile = document.createElement('div');
      tile.className = 'tile' + (i === 0 ? ' wide' : '');
      tile.style.setProperty('--c', color);
      tile.innerHTML = `
        <div class="tile-cat">${escapeHtml(label)}</div>
        <div class="tile-title">${escapeHtml(p.title)}</div>
        <div class="tile-date">${dateStr}</div>
      `;
      tile.addEventListener('click', () => openDetail(p));
      list.appendChild(tile);
    });
  }

  /* ---------------- pantalla de detalle ---------------- */
  const detailScreen = document.getElementById('detail-screen');
  const detailInner = document.getElementById('detail-inner');

  function openDetail(p){
    const cat = catById(p.category);
    const color = cat ? cat.color : 'var(--steel)';
    const label = cat ? cat.label : p.category;
    const d = new Date(p.date + 'T00:00:00');
    const dateStr = d.toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' });

    const bodyHtml = (p.body || []).map(par => `<p>${escapeHtml(par)}</p>`).join('');
    const galleryHtml = (p.images && p.images.length)
      ? `<div class="gallery">${p.images.map(img => `
          <figure>
            <img src="${img.src}" alt="${escapeHtml(img.caption || p.title)}" loading="lazy">
            ${img.caption ? `<figcaption>${escapeHtml(img.caption)}</figcaption>` : ''}
          </figure>`).join('')}</div>`
      : '';

    detailScreen.style.setProperty('--c', color);
    detailInner.innerHTML = `
      <div class="detail-cat">${escapeHtml(label)}</div>
      <h1 class="detail-title">${escapeHtml(p.title)}</h1>
      <div class="detail-meta">${dateStr}${p.device ? `<span class="sep">·</span>${escapeHtml(p.device)}` : ''}</div>
      <div class="detail-summary">${escapeHtml(p.summary)}</div>
      <div class="detail-body">${bodyHtml}</div>
      ${galleryHtml}
    `;
    detailScreen.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDetail(){
    detailScreen.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('back-btn').addEventListener('click', closeDetail);
  document.getElementById('start-orb').addEventListener('click', () => {
    window.scrollTo({ top:0, behavior:'smooth' });
  });

  /* ---------------- menú de enlaces (accesible, para pantalla vertical) ---------------- */
  const menuBtn = document.getElementById('menu-btn');
  const navSheet = document.getElementById('nav-sheet');
  const navBackdrop = document.getElementById('nav-backdrop');

  function openMenu(){
    navSheet.classList.add('open');
    navBackdrop.classList.add('open');
    navSheet.setAttribute('aria-hidden', 'false');
    menuBtn.setAttribute('aria-expanded', 'true');
    navSheet.querySelector('a').focus();
  }
  function closeMenu(){
    navSheet.classList.remove('open');
    navBackdrop.classList.remove('open');
    navSheet.setAttribute('aria-hidden', 'true');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', () => {
    navSheet.classList.contains('open') ? closeMenu() : openMenu();
  });
  navBackdrop.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && navSheet.classList.contains('open')) closeMenu();
  });
  navSheet.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

  document.getElementById('search').addEventListener('input', render);

  renderCatButtons();
  render();

  /* ---------------- reloj en vivo, zona horaria del dispositivo ---------------- */
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  function tick(){
    const now = new Date();
    document.getElementById('clock-time').textContent =
      now.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit', timeZone: tz });
    document.getElementById('clock-date').textContent =
      now.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short', timeZone: tz });
  }
  tick();
  setInterval(tick, 1000);
</script>
